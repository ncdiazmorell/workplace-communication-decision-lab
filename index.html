<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workplace Communication | Decision Lab</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#193b40;background:#eaf2f3}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:850px;margin:24px auto;background:white;border-radius:18px;overflow:hidden;box-shadow:0 12px 38px #1233}header{background:#175e67;color:white;padding:28px 36px}header h1{margin:4px 0;font-size:1.7rem}header p{margin:5px 0;color:#e2f3f3}.content{padding:32px 36px}.eyebrow{color:#426e75;font-size:.8rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase}h2{font-size:1.4rem;line-height:1.35}p{line-height:1.6}.scene{background:#f1f7f7;border-left:4px solid #438d93;padding:16px 20px;margin:20px 0}.choices{display:grid;gap:12px;margin:20px 0}button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid #9cb8bc;background:white;color:#193b40;text-align:left;padding:14px 17px;line-height:1.45}button:hover,button:focus-visible{border-color:#175e67;background:#e9f5f4}button.primary{background:#175e67;color:white;border-color:#175e67;text-align:center;font-weight:700}button.primary:hover{background:#104951}.feedback{background:#fff7e9;border-left:4px solid #c28b38;padding:17px 20px;margin:20px 0}.feedback strong{display:block;margin-bottom:5px}.muted{color:#557077}.bar{height:7px;background:#d9e8e8}.bar>div{height:100%;background:#25808a;transition:width .2s}footer{font-size:.8rem;color:#637c80;padding:0 36px 26px}@media(max-width:600px){body{padding:8px}.content{padding:22px}header{padding:23px}footer{padding:0 22px 22px}}</style></head><body><main><header><p>PORTFOLIO DEMONSTRATION · SCENARIO-BASED LEARNING</p><h1>Workplace Communication: Decision Lab</h1><p>Practice navigating conflicting priorities without easy answers.</p></header><div class="bar"><div id="progress" style="width:0%"></div></div><section class="content" id="app" aria-live="polite"></section><footer>Illustrative learning experience · Designed to demonstrate branching decisions, consequences, and feedback.</footer></main><script>
const stages=[
{label:'The conflicting request',title:'Two people need your help',scene:'You are preparing a client report due at 3:00 p.m. Your team lead, Maya, asks you to finish it first. Ten minutes later, a senior coworker, Jordan, asks you to help fix a customer issue that may delay a shipment. Jordan says, “It should only take a few minutes.” You do not yet know how urgent the shipment issue is.',prompt:'What do you do first?',options:[{text:'Ask Jordan what happens if the issue waits, then explain your report deadline and coordinate priorities with Maya.',effect:'Jordan explains the shipment will be delayed by an hour unless someone acts. Maya now has enough information to decide how to divide the work.',insight:'You gathered the missing facts and made the trade-off visible without assuming either request was unimportant.',points:2,tag:'Strong judgment'},{text:'Help Jordan immediately because customer issues usually take priority.',effect:'The customer issue is resolved, but the report falls behind. Maya is surprised you changed priorities without telling her.',insight:'Customer impact matters, but urgency does not automatically grant authority to override an existing deadline.',points:1,tag:'Understandable trade-off'},{text:'Tell Jordan you cannot help until the report is finished.',effect:'You protect your deadline, but the shipment issue escalates while the team still has no shared view of priorities.',insight:'Protecting a commitment is reasonable. A quick question about impact could have prevented a costly delay.',points:0,tag:'Missed information'}]},
{label:'The conversation',title:'Your lead pushes back',scene:'Maya says, “We cannot miss the client deadline.” Jordan replies, “The shipment affects a customer right now.” Both are speaking quickly, and each believes their task is more important. You have 45 minutes before the next status update.',prompt:'How do you move the discussion forward?',options:[{text:'Suggest splitting your time evenly between both tasks so everyone feels heard.',effect:'Both colleagues agree at first, but switching tasks repeatedly creates errors and neither deliverable is finished on time.',insight:'Compromise can sound fair without being effective. Priorities should reflect impact, deadlines, and available support.',points:1,tag:'Fair, but inefficient'},{text:'Ask each person for the latest acceptable completion time, then propose a concrete division of work for their approval.',effect:'Maya takes the report’s final review while Jordan handles the customer call; you prepare the report data. Everyone knows who owns what.',insight:'You shifted the conversation from competing demands to a workable plan with owners and deadlines.',points:2,tag:'Strong coordination'},{text:'Ask Maya to tell Jordan directly that the report comes first.',effect:'Maya settles the dispute, but Jordan feels dismissed and you lose an opportunity to help clarify the shared problem.',insight:'Escalating to the lead is sometimes necessary, but you can first present options and relevant facts.',points:0,tag:'Premature escalation'}]},
{label:'The follow-up',title:'A detail changes the plan',scene:'Twenty minutes later, you discover that the report includes a figure Jordan was supposed to verify. Jordan is still handling the shipment issue and may not be available before the deadline. You could submit the report without confirmation, but the figure might be wrong.',prompt:'What is your next move?',options:[{text:'Submit on time and flag the figure afterward if it turns out to be incorrect.',effect:'The report arrives on time, but the unverified figure creates confusion when the client questions it.',insight:'Speed matters, but an unverified fact can damage trust. Risks should be communicated before submission.',points:0,tag:'Unnecessary risk'},{text:'Wait for Jordan to finish, even if that means missing the deadline.',effect:'The figure is eventually verified, but Maya and the client receive no warning about the delay.',insight:'Accuracy is important. Silence about a likely delay prevents others from making informed decisions.',points:1,tag:'Accuracy without coordination'},{text:'Tell Maya what is unverified, propose a short verification window, and offer a clearly labeled provisional version if needed.',effect:'Maya approves a brief verification window and alerts the client. Jordan confirms the figure in time for the final version.',insight:'You surfaced uncertainty early and offered options that balance accuracy, transparency, and timing.',points:2,tag:'Strong risk communication'}]}
];let step=-1,score=0,history=[],selected=null;const app=document.getElementById('app'),bar=document.getElementById('progress');function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){bar.style.width=(step<0?0:step>=3?100:Math.round(step/3*100))+'%';if(step===-1){app.innerHTML='<div class="eyebrow">5–7 minutes · 3 decisions</div><h2>Good workplace decisions rarely come with obvious answers.</h2><p>You will navigate competing priorities, disagreement, and an unexpected risk. Each option has a plausible rationale—and a consequence.</p><p><strong>Learning goals:</strong> clarify priorities, coordinate with stakeholders, and communicate risks before they become problems.</p><p class="muted">There is no penalty for exploring. Review your choices at the end.</p><button class="primary" id="start">Start scenario →</button>';document.getElementById('start').onclick=()=>{step=0;render()};return}if(step>=3){let band=score>=5?'You coordinated effectively under pressure.':score>=3?'You made some useful choices and found areas to strengthen.':'Your decisions reveal opportunities to clarify priorities and communicate risks earlier.';app.innerHTML='<div class="eyebrow">Reflection and debrief</div><h2>'+band+'</h2><p>You earned <strong>'+score+' of 6</strong> decision-quality points. This is a practice indicator, not a formal assessment.</p>'+history.map((h,i)=>'<div class="scene"><strong>Decision '+(i+1)+': '+escapeHtml(stages[i].label)+'</strong><p>'+escapeHtml(h.choice)+'</p><p><strong>Consequence:</strong> '+escapeHtml(h.effect)+'</p><p><strong>Takeaway:</strong> '+escapeHtml(h.insight)+'</p></div>').join('')+'<p><strong>Transfer to work:</strong> Next time priorities conflict, what information would you gather before committing to a task?</p><button class="primary" id="again">Try different decisions ↺</button>';document.getElementById('again').onclick=()=>{step=-1;score=0;history=[];selected=null;render()};return}const s=stages[step];app.innerHTML='<div class="eyebrow">Decision '+(step+1)+' of 3 · '+escapeHtml(s.label)+'</div><h2>'+escapeHtml(s.title)+'</h2><div class="scene">'+escapeHtml(s.scene)+'</div><p><strong>'+escapeHtml(s.prompt)+'</strong></p><div class="choices">'+s.options.map((o,i)=>'<button data-choice="'+i+'"><strong>'+String.fromCharCode(65+i)+'.</strong> '+escapeHtml(o.text)+'</button>').join('')+'</div><div id="result"></div>';document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.choice)))}function choose(i){if(selected!==null)return;selected=i;const s=stages[step],o=s.options[i];score+=o.points;history.push({choice:o.text,effect:o.effect,insight:o.insight});document.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;b.style.opacity=Number(b.dataset.choice)===i?'1':'.55'});document.getElementById('result').innerHTML='<div class="feedback"><strong>'+escapeHtml(o.tag)+'</strong><p><strong>What happens:</strong> '+escapeHtml(o.effect)+'</p><p><strong>Design insight:</strong> '+escapeHtml(o.insight)+'</p></div><button class="primary" id="next">'+(step===2?'View reflection →':'Continue →')+'</button>';document.getElementById('next').onclick=()=>{selected=null;step++;render()}}render();
</script></body></html>
